name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The minimum verification bar from docs/DEVELOPMENT.md, automated.
# There is no test suite yet; add pytest here when it exists.
jobs:
  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        # vite.config.ts refuses production builds without a real token; this value
        # only proves the build works and is not a secret.
        env:
          VITE_DASHBOARD_TOKEN: ci-build-token-not-a-secret
        run: npx vite build

  backend:
    name: Backend (compile + import)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Syntax check
        working-directory: backend/src
        run: >
          python -m py_compile main.py middleware.py auth.py user_auth.py docker_simple.py
          trivy_scanner.py cis_scanner.py core/config.py routers/*.py api/health.py
          models.py stores.py
      - name: Import smoke test
        # The app runs as src.main:app from backend/. Importing it catches broken imports
        # and module-level errors that py_compile cannot. Databases are redirected to a
        # temp dir so CI never touches the workspace.
        env:
          AGENTS_DB_PATH: ${{ runner.temp }}/agents.db
          USERS_DB_PATH: ${{ runner.temp }}/users.db
        run: python -c "from src.main import app; print('routes:', len(app.routes))"

  agent:
    name: Agent (go build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/cmd/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/cmd/agent/go.mod
          cache-dependency-path: agent/cmd/agent/go.sum
      - run: go build ./...
